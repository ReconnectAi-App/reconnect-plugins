name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check marketplace and plugin
        run: node scripts/check.mjs
      # Claude Code's own validator, pinned. Runs without login.
      - name: claude plugin validate (marketplace)
        run: npx --yes @anthropic-ai/claude-code@2.1.322 plugin validate . --strict
      - name: claude plugin validate (plugin)
        run: npx --yes @anthropic-ai/claude-code@2.1.322 plugin validate plugins/reconnect --strict
